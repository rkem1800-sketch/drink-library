<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a120c">
  <title>RK's Drink Library</title>
  <style>
    :root {
      --wood: #1a120c;
      --wood-soft: #2a1d14;
      --paper: #f6edd9;
      --paper-2: #efe3cb;
      --ink: #24170f;
      --muted: #6e5848;
      --line: #d9c7a8;
      --gold: #d4a34a;
      --gold-deep: #b8862e;
      --copper: #b85c28;
      --white: #fffaf1;
      --shadow: 0 8px 28px rgba(36, 23, 15, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #3a2818 0%, transparent 55%),
        var(--wood);
      color: var(--ink);
      line-height: 1.45;
    }

    .shell {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header.app-head {
      text-align: center;
      color: var(--paper);
      padding: 18px 8px 8px;
    }
    .eyebrow {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--gold);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0 0 8px;
    }
    h1 {
      font-weight: 600;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      margin: 0 0 6px;
      letter-spacing: 0.02em;
    }
    .tagline {
      margin: 0;
      color: #e8d7b8;
      opacity: 0.85;
      font-size: 0.98rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 22px auto 18px;
      padding: 6px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(212, 163, 74, 0.25);
      border-radius: 999px;
      max-width: 440px;
    }
    .tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      color: #e8d7b8;
      font: inherit;
      font-size: 0.95rem;
      padding: 10px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .tabs button[aria-selected="true"] {
      background: var(--gold);
      color: var(--wood);
      font-weight: 600;
    }

    .panel {
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px 22px;
      min-height: 60vh;
    }
    .panel[hidden] { display: none; }

    .toolbar {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (min-width: 640px) {
      .toolbar { grid-template-columns: 1fr auto auto; }
    }

    input[type="search"], select, input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 1rem;
    }
    input:focus, select:focus, button:focus-visible {
      outline: 2px solid var(--copper);
      outline-offset: 2px;
    }

    .count {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 12px;
    }

    table.drinks {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.96rem;
    }
    table.drinks th {
      text-align: left;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding: 8px 8px 8px 0;
    }
    table.drinks td {
      vertical-align: top;
      padding: 14px 10px 14px 0;
      border-bottom: 1px solid var(--line);
    }
    table.drinks tr:last-child td { border-bottom: 0; }
    .name {
      font-weight: 600;
      font-size: 1.08rem;
    }
    .price { white-space: nowrap; font-weight: 600; color: var(--copper); }
    .ing, .notes, .source {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.86rem;
    }
    .ing { color: #3c2b1f; }
    .notes { color: var(--muted); margin-top: 6px; font-style: italic; }
    .source { color: #8a7462; margin-top: 4px; font-size: 0.75rem; }

    .badge {
      display: inline-block;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 3px 8px;
      margin: 0 4px 4px 0;
      background: var(--paper-2);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .badge.Seasonal { background: #f3dfb3; border-color: #e2c789; }
    .badge.House { background: #dce8c9; border-color: #c2d3a4; }
    .badge.Dessert { background: #edd5c4; border-color: #d9b59c; }

    .empty, .error {
      text-align: center;
      padding: 36px 12px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      table.drinks thead { display: none; }
      table.drinks, table.drinks tbody, table.drinks tr, table.drinks td {
        display: block;
        width: 100%;
      }
      table.drinks tr {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      table.drinks td {
        border: 0;
        padding: 2px 0;
      }
      table.drinks td.price {
        position: absolute;
        /* keep flow; price sits with name via grid on the row */
      }
      table.drinks tr {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 10px;
      }
      table.drinks td.name-cell { grid-column: 1; }
      table.drinks td.price { grid-column: 2; grid-row: 1; }
      table.drinks td.meta { grid-column: 1 / -1; }
      table.drinks td.ing-cell, table.drinks td.notes-cell { grid-column: 1 / -1; }
    }

    /* Calculator */
    .calc-head {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 18px;
    }
    .field { flex: 1 1 160px; }
    .field label, .heat-label {
      display: block;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      max-width: 200px;
    }
    .stepper button {
      width: 44px;
      height: 44px;
      border: 0;
      background: var(--paper-2);
      color: var(--ink);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .stepper input {
      border: 0;
      text-align: center;
      border-radius: 0;
      width: 72px;
      padding: 8px 4px;
      -moz-appearance: textfield;
    }
    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button { appearance: none; margin: 0; }

    .heat {
      display: flex;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .heat button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 11px 14px;
      font: inherit;
      cursor: pointer;
      color: var(--ink);
    }
    .heat button[aria-pressed="true"] {
      background: var(--copper);
      color: #fff8ee;
      font-weight: 600;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 8px 0 18px;
    }
    .stat {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .stat .k {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stat .v {
      font-size: 1.35rem;
      font-weight: 600;
      margin-top: 2px;
    }
    .stat .s { font-size: 0.8rem; color: var(--muted); }

    h2 {
      font-size: 1.2rem;
      margin: 8px 0 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
    }
    h3 { font-size: 1.02rem; margin: 16px 0 8px; }

    .shop, .recipe, .shake, .serve {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .shop ul, .recipe ol, .shake ol, .serve p, .recipe p {
      margin: 0;
      padding-left: 1.15rem;
    }
    .shop li, .recipe li, .shake li { margin: 0 0 7px; }
    .shop .where {
      display: block;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .total {
      margin-top: 10px;
      font-weight: 600;
      color: var(--copper);
    }
    .store {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.86rem;
      color: var(--muted);
      margin: 0 0 10px;
    }
    footer.fine {
      text-align: center;
      color: #cbb892;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="app-head">
      <p class="eyebrow">Home bar companion</p>
      <h1>RK's Drink Library</h1>
      <p class="tagline">Saved menus, recipes, and a Whiskey Powers batch calculator.</p>
    </header>

    <div class="tabs" role="tablist" aria-label="App sections">
      <button type="button" role="tab" id="tab-library" aria-controls="panel-library" aria-selected="true">Drink Library</button>
      <button type="button" role="tab" id="tab-calc" aria-controls="panel-calc" aria-selected="false">Whiskey Powers Calculator</button>
    </div>

    <section class="panel" id="panel-library" role="tabpanel" aria-labelledby="tab-library">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search name, ingredients, or notes" autocomplete="off">
        <select id="spirit" aria-label="Filter by spirit">
          <option value="">All spirits</option>
        </select>
        <select id="dtype" aria-label="Filter by type">
          <option value="">All types</option>
        </select>
      </div>
      <p class="count" id="count"></p>
      <div id="library-body">
        <p class="empty">Loading drinks…</p>
      </div>
    </section>

    <section class="panel" id="panel-calc" role="tabpanel" aria-labelledby="tab-calc" hidden>
      <div class="calc-head">
        <div class="field">
          <label for="drinks">Number of drinks</label>
          <div class="stepper">
            <button type="button" id="minus" aria-label="Fewer drinks">−</button>
            <input type="number" id="drinks" min="1" max="99" value="5" inputmode="numeric">
            <button type="button" id="plus" aria-label="More drinks">+</button>
          </div>
        </div>
        <div class="field">
          <span class="heat-label" id="heat-label">Heat</span>
          <div class="heat" role="group" aria-labelledby="heat-label">
            <button type="button" data-heat="mild" aria-pressed="false">Mild</button>
            <button type="button" data-heat="medium" aria-pressed="true">Medium</button>
            <button type="button" data-heat="hot" aria-pressed="false">Hot</button>
          </div>
        </div>
      </div>
      <div id="calc-out"></div>
    </section>

    <footer class="fine">Static app · edit drinks.json to add more drinks</footer>
  </div>

  <script>
    const PER = { bourbonOz: 2, limeOz: 0.75, syrupOz: 0.75, eggWhite: 1 };
    const LIME_OZ_EACH = 0.8;
    const SYRUP_BATCH_OZ = 8;
    const BOTTLE_OZ = 25.4;
    const HT = "Harris Teeter Sun Valley, 6610 Old Monroe Rd, Indian Trail";
    const PRICES = {
      limePack: 1.00,
      jalapeno: 0.21,
      agave: 5.99,
      cinnamon: 1.49,
      vanilla: 5.49,
      eggs: 3.99
    };
    const HEAT = {
      mild: "Mild: slice the whole jalapeño, scrape out the seeds and white ribs, simmer 5 minutes, and pull the jalapeño after 3 minutes.",
      medium: "Medium: slice the whole jalapeño, seeds and all (stem only out), and simmer 5 minutes.",
      hot: "Hot: slice the whole jalapeño, seeds and all, simmer 5 minutes, then take it off the heat and steep 10 more minutes."
    };

    function calculateBatch(n, heat) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      const bourbonOz = n * PER.bourbonOz;
      const limeOz = n * PER.limeOz;
      const syrupOz = n * PER.syrupOz;
      const eggWhites = n * PER.eggWhite;
      const limes = n === 0 ? 0 : Math.ceil(limeOz / LIME_OZ_EACH) + 1;
      const syrupBatches = Math.ceil(syrupOz / SYRUP_BATCH_OZ) || 0;
      const bottles = Math.ceil(bourbonOz / BOTTLE_OZ) || 0;
      const eggDozens = Math.ceil(n / 12) || 0;
      const limePacks = Math.ceil(limes / 3) || 0;
      const jalapenos = syrupBatches;
      const doubles = Math.floor(n / 2);
      const singles = n % 2;
      const pantry = n === 0 ? 0 : 1;
      const grocery =
        limePacks * PRICES.limePack +
        jalapenos * PRICES.jalapeno +
        pantry * (PRICES.agave + PRICES.cinnamon + PRICES.vanilla) +
        eggDozens * PRICES.eggs;
      return {
        n, heat, bourbonOz, limeOz, syrupOz, eggWhites,
        limes, syrupBatches, bottles, eggDozens, limePacks, jalapenos,
        doubles, singles, grocery, pantry
      };
    }

    function money(n) {
      return "$" + n.toFixed(2);
    }

    function fmtOz(n) {
      return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
    }

    function renderCalc(state) {
      const el = document.getElementById("calc-out");
      if (state.n < 1) {
        el.innerHTML = "<p class='empty'>Enter how many drinks you want to make.</p>";
        return;
      }
      const shakeBits = [];
      if (state.doubles) {
        shakeBits.push(
          "<li><strong>" + state.doubles + " double" + (state.doubles === 1 ? "" : "s") +
          ":</strong> 4 oz bourbon, 1½ oz lime, 1½ oz syrup, and 2 egg whites. Dry-shake 20 seconds, then shake with ice 20 seconds, and split between two glasses.</li>"
        );
      }
      if (state.singles) {
        shakeBits.push(
          "<li><strong>" + state.singles + " single:</strong> 2 oz bourbon, ¾ oz lime, ¾ oz syrup, and 1 egg white. Dry-shake 15 seconds, then shake with ice 15 seconds.</li>"
        );
      }
      el.innerHTML =
        "<div class='cards'>" +
          stat("Bourbon", fmtOz(state.bourbonOz) + " oz", state.bottles + " × 750 ml bottle" + (state.bottles === 1 ? "" : "s")) +
          stat("Lime juice", fmtOz(state.limeOz) + " oz", state.limes + " lime" + (state.limes === 1 ? "" : "s") + " (incl. 1 garnish)") +
          stat("Jalapeño syrup", fmtOz(state.syrupOz) + " oz", state.syrupBatches + " batch" + (state.syrupBatches === 1 ? "" : "es") + " · ~8 oz each") +
          stat("Egg whites", String(state.eggWhites), state.eggDozens + " dozen") +
        "</div>" +
        "<div class='shop'>" +
          "<h2>Shopping list</h2>" +
          "<p class='store'>" + HT + ". Prices as of Oct 10, 2026. Bourbon is at the ABC store; everything else is at this Harris Teeter.</p>" +
          "<ul>" +
            "<li>Elijah Craig or Maker's Mark bourbon — " + state.bottles + " × 750 ml<span class='where'>ABC store. Elijah Craig works great; if it is Barrel Proof, pull the pour back a little or add a splash of lime.</span></li>" +
            "<li>Fresh large limes — " + state.limes + " (" + state.limePacks + " pack" + (state.limePacks === 1 ? "" : "s") + " of 3 for $1.00) · " + money(state.limePacks * PRICES.limePack) + "<span class='where'>Produce</span></li>" +
            "<li>Fresh jalapeño peppers — " + state.jalapenos + " (one per syrup batch) · " + money(state.jalapenos * PRICES.jalapeno) + " <span class='where'>Produce · $0.21 each</span></li>" +
            "<li>Simple Truth Organic Blue Agave Nectar — 1 bottle · $5.99<span class='where'>Aisle 4</span></li>" +
            "<li>Badia Cinnamon Sticks — 1 jar · $1.49<span class='where'>Aisle 1</span></li>" +
            "<li>Private Selection Pure Vanilla Extract — 1 bottle · $5.49<span class='where'>Aisle 4</span></li>" +
            "<li>Eggland's Best Large Eggs — " + state.eggDozens + " dozen · " + money(state.eggDozens * PRICES.eggs) + "<span class='where'>Dairy · $3.99 each</span></li>" +
          "</ul>" +
          "<p class='total'>Harris Teeter estimate (no bourbon): " + money(state.grocery) + "</p>" +
        "</div>" +
        "<div class='recipe'>" +
          "<h2>Jalapeño agave syrup</h2>" +
          "<p>One batch makes about 8 oz. You need " + state.syrupBatches + " batch" + (state.syrupBatches === 1 ? "" : "es") + ". Per batch:</p>" +
          "<ol>" +
            "<li>Combine ½ cup agave, ½ cup water, 1 sliced jalapeño, and 2 cinnamon sticks.</li>" +
            "<li>" + HEAT[state.heat] + "</li>" +
            "<li>Take it off the heat, stir in ½ tsp vanilla, let it cool, and strain. The seeds stay out of the drinks.</li>" +
          "</ol>" +
        "</div>" +
        "<div class='shake'>" +
          "<h2>Shaking plan</h2>" +
          "<ol>" + shakeBits.join("") +
            "<li>Before you start, squeeze all the lime juice and separate the egg whites so you can just pour and shake.</li>" +
          "</ol>" +
        "</div>" +
        "<div class='serve'>" +
          "<h2>Serve</h2>" +
          "<p>Pour over one big cube in a rocks glass so it stays cold without watering down fast. The foam still sits on top. Garnish with a lime wheel, a jalapeño slice, or a dusting of cinnamon.</p>" +
        "</div>";
    }

    function stat(k, v, s) {
      return "<div class='stat'><div class='k'>" + k + "</div><div class='v'>" + v + "</div><div class='s'>" + s + "</div></div>";
    }

    let drinks = [];
    let heat = "medium";

    function unique(key) {
      return Array.from(new Set(drinks.map(function (d) { return d[key]; }))).sort();
    }

    function fillSelect(id, values) {
      const sel = document.getElementById(id);
      const current = sel.value;
      const first = sel.options[0];
      sel.innerHTML = "";
      sel.appendChild(first);
      values.forEach(function (v) {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
      if (values.indexOf(current) !== -1) sel.value = current;
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderLibrary() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const spirit = document.getElementById("spirit").value;
      const dtype = document.getElementById("dtype").value;
      const rows = drinks.filter(function (d) {
        if (spirit && d.spirit !== spirit) return false;
        if (dtype && d.type !== dtype) return false;
        if (!q) return true;
        const blob = [d.name, d.ingredients, d.notes].join(" ").toLowerCase();
        return blob.indexOf(q) !== -1;
      });
      document.getElementById("count").textContent =
        rows.length + " of " + drinks.length + " drink" + (drinks.length === 1 ? "" : "s");
      const body = document.getElementById("library-body");
      if (!rows.length) {
        body.innerHTML = "<p class='empty'>No drinks match that search.</p>";
        return;
      }
      const trs = rows.map(function (d) {
        const notes = d.notes
          ? "<div class='notes'>" + escapeHtml(d.notes) + "</div>"
          : "";
        return "<tr>" +
          "<td class='name-cell'><div class='name'>" + escapeHtml(d.name) + "</div></td>" +
          "<td class='price'>$" + escapeHtml(d.price) + "</td>" +
          "<td class='meta'><span class='badge'>" + escapeHtml(d.spirit) + "</span><span class='badge " + escapeHtml(d.type) + "'>" + escapeHtml(d.type) + "</span></td>" +
          "<td class='ing-cell'><div class='ing'>" + escapeHtml(d.ingredients) + "</div></td>" +
          "<td class='notes-cell'>" + notes + "<div class='source'>" + escapeHtml(d.source) + "</div></td>" +
        "</tr>";
      }).join("");
      body.innerHTML =
        "<table class='drinks'><thead><tr>" +
        "<th>Drink</th><th>Price</th><th>Spirit / type</th><th>Ingredients</th><th>Notes</th>" +
        "</tr></thead><tbody>" + trs + "</tbody></table>";
    }

    function showTab(which) {
      const lib = which === "library";
      document.getElementById("tab-library").setAttribute("aria-selected", lib ? "true" : "false");
      document.getElementById("tab-calc").setAttribute("aria-selected", lib ? "false" : "true");
      document.getElementById("panel-library").hidden = !lib;
      document.getElementById("panel-calc").hidden = lib;
    }

    function currentN() {
      return parseInt(document.getElementById("drinks").value, 10);
    }

    function setN(n) {
      n = Math.min(99, Math.max(1, Math.floor(Number(n) || 1)));
      document.getElementById("drinks").value = n;
      renderCalc(calculateBatch(n, heat));
    }

    document.getElementById("tab-library").addEventListener("click", function () { showTab("library"); });
    document.getElementById("tab-calc").addEventListener("click", function () { showTab("calc"); });
    document.getElementById("search").addEventListener("input", renderLibrary);
    document.getElementById("spirit").addEventListener("change", renderLibrary);
    document.getElementById("dtype").addEventListener("change", renderLibrary);
    document.getElementById("minus").addEventListener("click", function () { setN(currentN() - 1); });
    document.getElementById("plus").addEventListener("click", function () { setN(currentN() + 1); });
    document.getElementById("drinks").addEventListener("input", function () { setN(currentN()); });
    document.querySelectorAll(".heat button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        heat = btn.getAttribute("data-heat");
        document.querySelectorAll(".heat button").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        renderCalc(calculateBatch(currentN(), heat));
      });
    });

    renderCalc(calculateBatch(5, "medium"));

    fetch("drinks.json")
      .then(function (res) {
        if (!res.ok) throw new Error("Could not load drinks.json");
        return res.json();
      })
      .then(function (data) {
        drinks = Array.isArray(data) ? data : [];
        fillSelect("spirit", unique("spirit"));
        fillSelect("dtype", unique("type"));
        renderLibrary();
      })
      .catch(function (err) {
        document.getElementById("library-body").innerHTML =
          "<p class='error'>Couldn't load drinks.json. Serve this folder over HTTP (not as a local file) and keep drinks.json next to index.html.</p>";
        document.getElementById("count").textContent = "";
        console.error(err);
      });
  </script>
</body>
</html>

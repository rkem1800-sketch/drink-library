<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drinks">
  <title>RK's Drink Library</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #07080f;
  --bg-2: #0c0e18;
  --elev: #12141f;
  --elev-2: #191c2b;
  --ink: #f6f0e6;
  --muted: #9a8f7d;
  --gold: #e8b85a;
  --gold-2: #f3d48a;
  --gold-dim: #b8893a;
  --copper: #c46a2a;
  --line: rgba(232, 184, 90, 0.16);
  --glow: rgba(232, 184, 90, 0.28);
  --danger: #e07050;
  --sans: "Outfit", ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  --serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
  --tab-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--bg); }
body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(900px 480px at 50% -12%, rgba(232, 184, 90, 0.18), transparent 58%),
    radial-gradient(700px 500px at 110% 90%, rgba(70, 40, 130, 0.16), transparent 55%),
    var(--bg);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
  background: linear-gradient(to bottom, rgba(7,8,15,0.96) 60%, rgba(7,8,15,0.72) 85%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
}
.kicker {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
}
h1.display {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(1.85rem, 7vw, 2.35rem);
  letter-spacing: -0.03em;
  margin: 2px 0 0;
  line-height: 1.1;
}
.sub {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.main {
  padding: 4px 16px calc(var(--tab-h) + 20px + env(safe-area-inset-bottom));
  max-width: 560px;
  margin: 0 auto;
}
.panel { display: none; animation: rise 0.38s ease both; }
.panel.active { display: block; }
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.search-wrap {
  position: relative;
  margin: 4px 0 12px;
}
.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  stroke: var(--muted);
  fill: none;
  pointer-events: none;
}
#search {
  width: 100%;
  border: 1px solid var(--line);
  background: rgba(18, 20, 31, 0.9);
  border-radius: 14px;
  padding: 12px 14px 12px 42px;
  font-size: 1rem;
  outline: none;
}
#search:focus { border-color: rgba(232, 184, 90, 0.5); box-shadow: 0 0 0 3px rgba(232, 184, 90, 0.15); }

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  margin: 0 0 14px;
  padding: 2px 0 6px;
}
.chips::-webkit-scrollbar { display: none; }
.chip, .tag {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--elev);
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 0.82rem;
  font-weight: 500;
}
.chip[aria-pressed="true"] {
  background: var(--gold);
  color: #1a1208;
  border-color: var(--gold);
  box-shadow: 0 0 18px var(--glow);
}
.tag {
  padding: 3px 8px;
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gold-2);
  background: rgba(232, 184, 90, 0.1);
}

.count {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.card {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--card, var(--elev));
  border-radius: 20px;
  padding: 10px 10px 12px;
  text-align: left;
  min-height: 216px;
  display: flex;
  flex-direction: column;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 28px rgba(0,0,0,0.28);
  position: relative;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.card::after {
  content: "";
  position: absolute;
  inset: auto -20% -30% auto;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, var(--glow-color, var(--glow)), transparent 70%);
  pointer-events: none;
}
.card:active { transform: scale(0.98); }
.card-visual {
  height: 112px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 4px 0 0;
  position: relative;
  z-index: 1;
}
.card-visual svg { height: 108px; width: auto; }
.card-meta { position: relative; z-index: 1; margin-top: auto; }
.card .price {
  position: absolute;
  top: 10px;
  right: 10px;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--gold-2);
  z-index: 2;
}
.card h2 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 1.02rem;
  letter-spacing: -0.02em;
  margin: 4px 0 6px;
  line-height: 1.15;
}
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }

.empty, .error {
  text-align: center;
  color: var(--muted);
  padding: 48px 12px;
  grid-column: 1 / -1;
}

/* Bottom tab bar */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  background: rgba(8, 10, 18, 0.88);
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  padding-left: calc(8px + env(safe-area-inset-left));
  padding-right: calc(8px + env(safe-area-inset-right));
}
.tabbar button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 0 2px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button[aria-selected="true"] {
  color: var(--gold);
  text-shadow: 0 0 12px var(--glow);
}
.tabbar button[aria-selected="true"] svg {
  filter: drop-shadow(0 0 6px var(--glow));
}

/* Bottom sheet */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s ease;
}
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  max-height: min(88vh, 760px);
  background: linear-gradient(180deg, #1a1d2c 0%, #0e101a 100%);
  border-radius: 24px 24px 0 0;
  border: 1px solid var(--line);
  border-bottom: 0;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(232, 184, 90, 0.08);
  transform: translateY(110%);
  transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.open { transform: none; }
.grabber {
  width: 40px;
  height: 5px;
  border-radius: 99px;
  background: rgba(255,255,255,0.18);
  margin: 8px auto 4px;
}
.sheet-scroll {
  overflow: auto;
  padding: 4px 20px 28px;
  -webkit-overflow-scrolling: touch;
}
.sheet-visual {
  height: 148px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  margin: 0 0 8px;
}
.sheet-visual svg { height: 140px; width: auto; filter: drop-shadow(0 8px 24px var(--glow)); }
.sheet-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.sheet h2 {
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  margin: 0;
  line-height: 1.1;
}
.sheet .price-lg {
  font-family: var(--serif);
  font-size: 1.6rem;
  color: var(--gold);
  font-weight: 600;
}
.close-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: var(--ink);
  font-size: 1.2rem;
}
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.pill {
  border-radius: 999px;
  padding: 7px 12px;
  background: rgba(232, 184, 90, 0.1);
  border: 1px solid var(--line);
  font-size: 0.86rem;
}
.notes {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.05rem;
  color: #e6d8c0;
  margin: 8px 0 12px;
}
.source { color: var(--muted); font-size: 0.8rem; margin: 0; }
.cta {
  width: 100%;
  margin-top: 16px;
  border: 0;
  border-radius: 14px;
  padding: 14px 16px;
  background: var(--gold);
  color: #1a1208;
  font-weight: 700;
  box-shadow: 0 0 28px var(--glow);
}

/* Surprise */
.surprise {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 8px;
}
.stage {
  width: min(280px, 80vw);
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 32px;
  background:
    radial-gradient(circle at 50% 45%, rgba(232,184,90,0.2), transparent 60%),
    var(--elev);
  border: 1px solid var(--line);
  margin: 12px 0 20px;
  box-shadow: 0 0 50px rgba(232, 184, 90, 0.12);
  position: relative;
  overflow: hidden;
}
.stage svg { height: 200px; width: auto; }
.stage.shaking .shaker { animation: shake 0.55s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: rotate(0) translateY(0); }
  15% { transform: rotate(-14deg) translateY(4px); }
  30% { transform: rotate(12deg) translateY(-6px); }
  45% { transform: rotate(-10deg) translateY(3px); }
  60% { transform: rotate(8deg) translateY(-4px); }
  75% { transform: rotate(-5deg) translateY(2px); }
}
.reveal-name {
  font-family: var(--serif);
  font-size: 1.8rem;
  margin: 0 0 6px;
  letter-spacing: -0.03em;
}
.shake-btn {
  border: 0;
  border-radius: 999px;
  padding: 14px 28px;
  background: var(--gold);
  color: #1a1208;
  font-weight: 700;
  font-size: 1.05rem;
  box-shadow: 0 0 32px var(--glow);
  margin: 8px 0 18px;
}
.shake-btn:active { transform: scale(0.97); }

/* Calculator */
.stepper-hero {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  margin: 10px 0 22px;
}
.step-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  background: rgba(232, 184, 90, 0.08);
  color: var(--gold-2);
  font-size: 2rem;
  line-height: 1;
  box-shadow: 0 0 20px rgba(232, 184, 90, 0.12);
}
.step-btn:active { background: rgba(232, 184, 90, 0.22); }
.step-count { text-align: center; min-width: 110px; }
.step-count input {
  width: 110px;
  border: 0;
  background: transparent;
  text-align: center;
  font-family: var(--serif);
  font-size: 4.2rem;
  font-weight: 600;
  letter-spacing: -0.04em;
  padding: 0;
  line-height: 1;
  -moz-appearance: textfield;
}
.step-count input::-webkit-outer-spin-button,
.step-count input::-webkit-inner-spin-button { appearance: none; margin: 0; }
.step-count .lbl {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-size: 0.7rem;
  font-weight: 600;
}

.heat {
  display: flex;
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
}
.heat button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 12px 6px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--muted);
}
.heat button .peppers { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
.heat button[aria-pressed="true"] {
  color: #1a1208;
  background: var(--gold);
  box-shadow: 0 0 24px var(--glow);
}
.heat button[data-heat="hot"][aria-pressed="true"] {
  background: linear-gradient(180deg, #f0a14a, #d4562a);
  color: #fff6ea;
}
.heat button[data-heat="mild"][aria-pressed="true"] {
  background: linear-gradient(180deg, #e8d48a, #c4b04a);
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.stat {
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  box-shadow: 0 0 18px rgba(232, 184, 90, 0.06);
  position: relative;
  overflow: hidden;
}
.stat::before {
  content: "";
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.45;
}
.stat .k {
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.stat .v {
  font-family: var(--serif);
  font-size: 1.55rem;
  font-weight: 600;
  margin-top: 2px;
  letter-spacing: -0.03em;
}
.stat .s { font-size: 0.75rem; color: var(--gold-dim); margin-top: 2px; }

.block {
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px 16px 14px;
  margin-bottom: 12px;
}
.block h2 {
  font-family: var(--serif);
  font-size: 1.25rem;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}
.store {
  color: var(--muted);
  font-size: 0.8rem;
  margin: 0 0 12px;
}
.shop-list { list-style: none; margin: 0; padding: 0; }
.shop-list li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.shop-list li:last-child { border-bottom: 0; }
.shop-list input {
  appearance: none;
  width: 22px;
  height: 22px;
  margin-top: 2px;
  flex: 0 0 22px;
  border-radius: 6px;
  border: 1.5px solid var(--gold-dim);
  background: transparent;
  position: relative;
}
.shop-list input:checked {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 10px var(--glow);
}
.shop-list input:checked::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 3px;
  width: 6px;
  height: 11px;
  border: 2px solid #1a1208;
  border-top: 0;
  border-left: 0;
  transform: rotate(45deg);
}
.shop-list label { flex: 1; cursor: pointer; }
.shop-list label.done span.item-name,
.shop-list label.done { color: var(--muted); text-decoration: line-through; }
.where { display: block; color: var(--muted); font-size: 0.75rem; text-decoration: none; }
.total {
  margin: 10px 0 0;
  font-weight: 700;
  color: var(--gold);
}

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  align-items: start;
  background: var(--elev-2);
  border-radius: 14px;
  padding: 12px;
  border: 1px solid var(--line);
}
.num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(232, 184, 90, 0.15);
  color: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.8rem;
}
.serve p { margin: 0; color: #e6d8c0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .stage.shaking .shaker { animation: none; }
}
input:focus, button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
</style>
</head>
<body>
  <header class="app-header" id="app-header">
    <p class="kicker" id="kicker">The library</p>
    <h1 class="display" id="headline">Tonight's drinks</h1>
    <p class="sub" id="subhead">What are you in the mood for?</p>
  </header>

  <main class="main">
    <section class="panel active" id="panel-library" role="tabpanel" aria-labelledby="tab-library">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>
        <input type="search" id="search" placeholder="Search name, ingredients, notes" autocomplete="off">
      </div>
      <div class="chips" id="spirit-chips" role="toolbar" aria-label="Filter by spirit"></div>
      <p class="count" id="count"></p>
      <div class="grid" id="library-body"></div>
    </section>

    <section class="panel" id="panel-surprise" role="tabpanel" aria-labelledby="tab-surprise">
      <div class="surprise">
        <div class="chips" id="surprise-chips" role="toolbar" aria-label="Limit surprise by spirit"></div>
        <div class="stage" id="stage">
          <div class="shaker" id="stage-art"></div>
        </div>
        <h2 class="reveal-name" id="surprise-name">Shake one up</h2>
        <p class="sub" id="surprise-sub">A random drink from the library — optionally narrowed by spirit.</p>
        <button type="button" class="shake-btn" id="shake-btn">Shake it</button>
        <button type="button" class="chip" id="surprise-open" hidden>See the recipe</button>
      </div>
    </section>

    <section class="panel" id="panel-calc" role="tabpanel" aria-labelledby="tab-calc">
      <div class="stepper-hero">
        <button type="button" class="step-btn" id="minus" aria-label="Fewer drinks">−</button>
        <div class="step-count">
          <input type="number" id="drinks" min="1" max="99" value="5" inputmode="numeric" aria-label="Number of drinks">
          <span class="lbl">drinks</span>
        </div>
        <button type="button" class="step-btn" id="plus" aria-label="More drinks">+</button>
      </div>
      <div class="heat" role="group" aria-label="Heat">
        <button type="button" data-heat="mild" aria-pressed="false">
          <span class="peppers" aria-hidden="true" data-n="1"></span>Mild
        </button>
        <button type="button" data-heat="medium" aria-pressed="true">
          <span class="peppers" aria-hidden="true" data-n="2"></span>Medium
        </button>
        <button type="button" data-heat="hot" aria-pressed="false">
          <span class="peppers" aria-hidden="true" data-n="3"></span>Hot
        </button>
      </div>
      <div id="calc-out"></div>
    </section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Main">
    <button type="button" role="tab" id="tab-library" aria-selected="true" aria-controls="panel-library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="7" height="9" rx="1.5"/>
        <rect x="14" y="4" width="7" height="9" rx="1.5"/>
        <rect x="8" y="15" width="8" height="6" rx="1.5"/>
      </svg>
      Library
    </button>
    <button type="button" role="tab" id="tab-surprise" aria-selected="false" aria-controls="panel-surprise">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/>
        <circle cx="12" cy="12" r="3.2"/>
      </svg>
      Surprise me
    </button>
    <button type="button" role="tab" id="tab-calc" aria-selected="false" aria-controls="panel-calc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 4h8v8.5a5 5 0 0 1-8 0V4Z"/>
        <path d="M8 8h8"/>
        <path d="M9 16v5M12 18v3M15 16v5"/>
      </svg>
      Calculator
    </button>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <button type="button" class="close-btn" id="sheet-close" aria-label="Close">×</button>
    <div class="sheet-scroll" id="sheet-body"></div>
  </div>

  <script>

    const PER = { bourbonOz: 2, limeOz: 0.75, syrupOz: 0.75, eggWhite: 1 };
    const LIME_OZ_EACH = 0.8;
    const SYRUP_BATCH_OZ = 8;
    const BOTTLE_OZ = 25.4;
    const HT = "Harris Teeter Sun Valley, 6610 Old Monroe Rd, Indian Trail";
    const PRICES = {
      limePack: 1.00,
      jalapeno: 0.21,
      agave: 5.99,
      cinnamon: 1.49,
      vanilla: 5.49,
      eggs: 3.99
    };
    const HEAT = {
      mild: "Mild: slice the whole jalapeño, scrape out the seeds and white ribs, simmer 5 minutes, and pull the jalapeño after 3 minutes.",
      medium: "Medium: slice the whole jalapeño, seeds and all (stem only out), and simmer 5 minutes.",
      hot: "Hot: slice the whole jalapeño, seeds and all, simmer 5 minutes, then take it off the heat and steep 10 more minutes."
    };

    function calculateBatch(n, heat) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      const bourbonOz = n * PER.bourbonOz;
      const limeOz = n * PER.limeOz;
      const syrupOz = n * PER.syrupOz;
      const eggWhites = n * PER.eggWhite;
      const limes = n === 0 ? 0 : Math.ceil(limeOz / LIME_OZ_EACH) + 1;
      const syrupBatches = Math.ceil(syrupOz / SYRUP_BATCH_OZ) || 0;
      const bottles = Math.ceil(bourbonOz / BOTTLE_OZ) || 0;
      const eggDozens = Math.ceil(n / 12) || 0;
      const limePacks = Math.ceil(limes / 3) || 0;
      const jalapenos = syrupBatches;
      const doubles = Math.floor(n / 2);
      const singles = n % 2;
      const pantry = n === 0 ? 0 : 1;
      const grocery =
        limePacks * PRICES.limePack +
        jalapenos * PRICES.jalapeno +
        pantry * (PRICES.agave + PRICES.cinnamon + PRICES.vanilla) +
        eggDozens * PRICES.eggs;
      return {
        n, heat, bourbonOz, limeOz, syrupOz, eggWhites,
        limes, syrupBatches, bottles, eggDozens, limePacks, jalapenos,
        doubles, singles, grocery, pantry
      };
    }

    const STYLE = {
      "Dreams Plum True": { glass: "coupe", liquid: "#8e3a6b", foam: "#f3e6ef", accent: "#c46a9a", card: "linear-gradient(165deg,#2c1526 0%,#120910 100%)" },
      "Sword Coast Special": { glass: "rocks", liquid: "#8a2a22", ice: "cubes", accent: "#d46a3a", card: "linear-gradient(165deg,#2a1412 0%,#12090a 100%)" },
      "Whiskey Powers": { glass: "rocks", liquid: "#c8882a", ice: "cube", garnish: "lime", accent: "#e8b85a", card: "linear-gradient(165deg,#2a1c0e 0%,#120e08 100%)" },
      "Pomfoolery": { glass: "coupe", liquid: "#9b1b33", accent: "#e07070", garnish: "rosemary", card: "linear-gradient(165deg,#2a1016 0%,#12080c 100%)" },
      "Envy": { glass: "highball", liquid: "#3a8a4a", accent: "#8ed46a", card: "linear-gradient(165deg,#102216 0%,#0a140e 100%)" },
      "Jalapeño Margarita": { glass: "rocks", liquid: "#7da81e", ice: "cubes", garnish: "lime", rim: "tajin", accent: "#c8e06a", card: "linear-gradient(165deg,#1a2410 0%,#0c1408 100%)" },
      "Strawberry Stick & Poke": { glass: "coupe", liquid: "#c43a4a", foam: "#f7e6e4", accent: "#f0a0a8", card: "linear-gradient(165deg,#2a1218 0%,#14080c 100%)" },
      "Ambrosia": { glass: "coupe", liquid: "#6a3a1e", foam: "#f0d8b8", accent: "#e0b070", card: "linear-gradient(165deg,#24180e 0%,#100c08 100%)" },
      "Campfire Coffee": { glass: "mug", liquid: "#3a2214", foam: "#f4e6d0", accent: "#d4a060", steam: true, card: "linear-gradient(165deg,#1c140e 0%,#0c0a08 100%)" },
      "Peppermint Bark Martini": { glass: "martini", liquid: "#d8d0cc", accent: "#7ac4b0", garnish: "stick", card: "linear-gradient(165deg,#14201e 0%,#0a1010 100%)" }
    };

    function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-"); }

    function glassSVG(name, tall) {
      const st = STYLE[name] || { glass: "coupe", liquid: "#c8882a" };
      const id = slug(name) + (tall ? "-lg" : "");
      const liq = st.liquid;
      const stroke = "#e8d5a8";
      const glassFill = "rgba(255,255,255,0.05)";
      const defs = '<defs><linearGradient id="liq-' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + liq + '" stop-opacity="0.82"/><stop offset="100%" stop-color="' + liq + '"/></linearGradient></defs>';
      let inner = "";
      if (st.glass === "martini") {
        inner =
          '<path d="M22 22 L50 70 L78 22" fill="none" stroke="' + stroke + '" stroke-width="1.8" stroke-linejoin="round"/>' +
          '<path d="M30 36 L50 68 L70 36 C58 44 42 44 30 36Z" fill="url(#liq-' + id + ')"/>' +
          (st.garnish === "stick" ? '<path d="M40 28 L72 18" stroke="#f4efe4" stroke-width="1.3" stroke-linecap="round"/><circle cx="74" cy="17" r="2.2" fill="#7ac4b0"/>' : "") +
          '<rect x="48.2" y="70" width="3.6" height="28" rx="1" fill="' + stroke + '"/>' +
          '<path d="M32 104 C44 96 56 96 68 104" fill="none" stroke="' + stroke + '" stroke-width="2.2" stroke-linecap="round"/>';
      } else if (st.glass === "rocks") {
        const rim = st.rim === "tajin"
          ? '<path d="M24 26 H76" stroke="#c45c3a" stroke-width="3" stroke-linecap="round" opacity="0.85"/>'
          : "";
        const ice = st.ice === "cube"
          ? '<rect x="38" y="48" width="22" height="22" rx="2" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>'
          : st.ice === "cubes"
            ? '<rect x="32" y="50" width="16" height="16" rx="2" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/><rect x="50" y="56" width="14" height="14" rx="2" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>'
            : "";
        const gar = st.garnish === "lime"
          ? '<circle cx="78" cy="40" r="7" fill="#8fbf3a"/><circle cx="78" cy="40" r="4.2" fill="#dce86a"/><path d="M78 33 V47 M71 40 H85" stroke="#6a9420" stroke-width="0.6"/>'
          : "";
        inner =
          '<rect x="24" y="26" width="52" height="68" rx="6" fill="' + glassFill + '" stroke="' + stroke + '" stroke-width="1.7"/>' +
          '<rect x="26.5" y="50" width="47" height="42" rx="3" fill="url(#liq-' + id + ')"/>' +
          ice + rim + gar +
          '<path d="M28 32 v18" stroke="rgba(255,255,255,0.28)" stroke-width="1.3" stroke-linecap="round"/>';
      } else if (st.glass === "highball") {
        inner =
          '<rect x="30" y="16" width="40" height="86" rx="5" fill="' + glassFill + '" stroke="' + stroke + '" stroke-width="1.7"/>' +
          '<rect x="32.4" y="46" width="35.2" height="54" rx="3" fill="url(#liq-' + id + ')"/>' +
          '<circle cx="42" cy="62" r="3" fill="rgba(255,255,255,0.25)"/><circle cx="54" cy="74" r="2.4" fill="rgba(255,255,255,0.2)"/>' +
          '<path d="M34 24 v28" stroke="rgba(255,255,255,0.28)" stroke-width="1.3" stroke-linecap="round"/>';
      } else if (st.glass === "mug") {
        inner =
          (st.steam ? '<path d="M40 18 c0-6 8-6 8 0 c0 6 8 6 8 0" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.4"/><path d="M52 14 c0-6 8-6 8 0" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>' : "") +
          '<path d="M28 32 h44 a4 4 0 0 1 4 4 v52 a10 10 0 0 1-10 10 H34 a10 10 0 0 1-10-10 V36 a4 4 0 0 1 4-4Z" fill="' + glassFill + '" stroke="' + stroke + '" stroke-width="1.7"/>' +
          '<path d="M72 42 h8 a10 10 0 0 1 0 28 h-8" fill="none" stroke="' + stroke + '" stroke-width="1.7"/>' +
          '<rect x="22.5" y="52" width="51" height="42" rx="4" fill="url(#liq-' + id + ')"/>' +
          (st.foam ? '<ellipse cx="48" cy="54" rx="24" ry="7" fill="' + st.foam + '" opacity="0.95"/>' : "");
      } else {
        inner =
          '<path d="M18 28 C18 28, 16 58, 50 70 C84 58, 82 28, 82 28" fill="' + glassFill + '" stroke="' + stroke + '" stroke-width="1.7" stroke-linejoin="round"/>' +
          '<path d="M22 44 C22 56, 32 66, 50 68 C68 66, 78 56, 78 44 C64 50, 36 50, 22 44Z" fill="url(#liq-' + id + ')"/>' +
          (st.foam ? '<path d="M22 44 C36 50, 64 50, 78 44 C76 37, 64 34, 50 34 C36 34, 24 37, 22 44Z" fill="' + st.foam + '"/>' : "") +
          (st.garnish === "rosemary" ? '<path d="M62 22 c8-16 4-22 0-28" fill="none" stroke="#6a8a4a" stroke-width="1.4"/><path d="M62 8 l-4-2 M61 12 l4-2 M63 16 l-3-2" stroke="#8aaa5a" stroke-width="1"/>' : "") +
          '<rect x="48.2" y="70" width="3.6" height="26" rx="1" fill="' + stroke + '"/>' +
          '<path d="M32 102 C44 95 56 95 68 102" fill="none" stroke="' + stroke + '" stroke-width="2.2" stroke-linecap="round"/>' +
          '<path d="M28 32 C26 42, 28 52, 34 58" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>';
      }
      return '<svg viewBox="0 0 100 120" aria-hidden="true">' + defs + inner + '</svg>';
    }

    function chiliSVG() {
      return '<svg width="13" height="16" viewBox="0 0 24 28" fill="currentColor" aria-hidden="true"><path d="M13 2c.4 2.2 2.2 3.1 3.8 2.8-.3 1.2-1.4 2-2.6 2.2 4.2 1.3 7.2 5.4 6.2 10.4C19.2 23.4 15 27 11 27S2.8 23.4 1.6 17.4C.6 12.4 3.8 8 9.4 7c.2-1.4.2-3.2-1.2-4.6 1.8-.2 3.6.6 4.8 3.6z"/><path d="M11.6 1.2c1.6-1.8 4.4-1 4.6 1.2-1.6.1-3 .8-3.6 2.2-.6-1.4-1-2.6-1-3.4z" opacity=".9"/></svg>';
    }

    function money(n) {
      return "$" + n.toFixed(2);
    }

    function fmtOz(n) {
      return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const SHOP_KEY = "wp-shop-checked";
    function getChecked() {
      try { return JSON.parse(localStorage.getItem(SHOP_KEY) || "{}"); } catch (e) { return {}; }
    }
    function toggleChecked(id, val) {
      const o = getChecked();
      o[id] = val;
      try { localStorage.setItem(SHOP_KEY, JSON.stringify(o)); } catch (e) {}
    }

    function renderCalc(state) {
      const el = document.getElementById("calc-out");
      if (state.n < 1) {
        el.innerHTML = "<p class='empty'>Enter how many drinks you want to make.</p>";
        return;
      }
      const shakeBits = [];
      if (state.doubles) {
        shakeBits.push(
          "<li><span class='num'>" + (shakeBits.length + 1) + "</span><span><strong>" + state.doubles + " double" + (state.doubles === 1 ? "" : "s") +
          ":</strong> 4 oz bourbon, 1½ oz lime, 1½ oz syrup, and 2 egg whites. Dry-shake 20 seconds, then shake with ice 20 seconds, and split between two glasses.</span></li>"
        );
      }
      if (state.singles) {
        shakeBits.push(
          "<li><span class='num'>" + (shakeBits.length + 1) + "</span><span><strong>" + state.singles + " single:</strong> 2 oz bourbon, ¾ oz lime, ¾ oz syrup, and 1 egg white. Dry-shake 15 seconds, then shake with ice 15 seconds.</span></li>"
        );
      }
      shakeBits.push("<li><span class='num'>" + (shakeBits.length + 1) + "</span><span>Before you start, squeeze all the lime juice and separate the egg whites so you can just pour and shake.</span></li>");
      const checked = getChecked();
      const items = [
        { id: "bourbon", html: "Elijah Craig or Maker's Mark bourbon — " + state.bottles + " × 750 ml<span class='where'>ABC store. Elijah Craig works great; if it is Barrel Proof, pull the pour back a little or add a splash of lime.</span>" },
        { id: "limes", html: "Fresh large limes — " + state.limes + " (" + state.limePacks + " pack" + (state.limePacks === 1 ? "" : "s") + " of 3 for $1.00) · " + money(state.limePacks * PRICES.limePack) + "<span class='where'>Produce</span>" },
        { id: "jalapenos", html: "Fresh jalapeño peppers — " + state.jalapenos + " (one per syrup batch) · " + money(state.jalapenos * PRICES.jalapeno) + " <span class='where'>Produce · $0.21 each</span>" },
        { id: "agave", html: "Simple Truth Organic Blue Agave Nectar — 1 bottle · $5.99<span class='where'>Aisle 4</span>" },
        { id: "cinnamon", html: "Badia Cinnamon Sticks — 1 jar · $1.49<span class='where'>Aisle 1</span>" },
        { id: "vanilla", html: "Private Selection Pure Vanilla Extract — 1 bottle · $5.49<span class='where'>Aisle 4</span>" },
        { id: "eggs", html: "Eggland's Best Large Eggs — " + state.eggDozens + " dozen · " + money(state.eggDozens * PRICES.eggs) + "<span class='where'>Dairy · $3.99 each</span>" }
      ];
      const lis = items.map(function (it) {
        const on = !!checked[it.id];
        return "<li><input type='checkbox' id='shop-" + it.id + "' data-shop='" + it.id + "'" + (on ? " checked" : "") + "><label for='shop-" + it.id + "' class='" + (on ? "done" : "") + "'><span class='item-name'>" + it.html + "</span></label></li>";
      }).join("");
      el.innerHTML =
        "<div class='stats'>" +
          stat("Bourbon", fmtOz(state.bourbonOz) + " oz", state.bottles + " × 750 ml bottle" + (state.bottles === 1 ? "" : "s")) +
          stat("Lime juice", fmtOz(state.limeOz) + " oz", state.limes + " lime" + (state.limes === 1 ? "" : "s") + " (incl. 1 garnish)") +
          stat("Jalapeño syrup", fmtOz(state.syrupOz) + " oz", state.syrupBatches + " batch" + (state.syrupBatches === 1 ? "" : "es") + " · ~8 oz each") +
          stat("Egg whites", String(state.eggWhites), state.eggDozens + " dozen") +
        "</div>" +
        "<div class='block shop'>" +
          "<h2>Shopping list</h2>" +
          "<p class='store'>" + HT + ". Prices as of Oct 10, 2026. Bourbon is at the ABC store; everything else is at this Harris Teeter.</p>" +
          "<ul class='shop-list'>" + lis + "</ul>" +
          "<p class='total'>Harris Teeter estimate (no bourbon): " + money(state.grocery) + "</p>" +
        "</div>" +
        "<div class='block recipe'>" +
          "<h2>Jalapeño agave syrup</h2>" +
          "<p class='store'>One batch makes about 8 oz. You need " + state.syrupBatches + " batch" + (state.syrupBatches === 1 ? "" : "es") + ". Per batch:</p>" +
          "<ol class='steps'>" +
            "<li><span class='num'>1</span><span>Combine ½ cup agave, ½ cup water, 1 sliced jalapeño, and 2 cinnamon sticks.</span></li>" +
            "<li><span class='num'>2</span><span>" + HEAT[state.heat] + "</span></li>" +
            "<li><span class='num'>3</span><span>Take it off the heat, stir in ½ tsp vanilla, let it cool, and strain. The seeds stay out of the drinks.</span></li>" +
          "</ol>" +
        "</div>" +
        "<div class='block shake'>" +
          "<h2>Shaking plan</h2>" +
          "<ol class='steps'>" + shakeBits.join("") + "</ol>" +
        "</div>" +
        "<div class='block serve'>" +
          "<h2>Serve</h2>" +
          "<p>Pour over one big cube in a rocks glass so it stays cold without watering down fast. The foam still sits on top. Garnish with a lime wheel, a jalapeño slice, or a dusting of cinnamon.</p>" +
        "</div>";
    }

    function stat(k, v, s) {
      return "<div class='stat'><div class='k'>" + k + "</div><div class='v'>" + v + "</div><div class='s'>" + s + "</div></div>";
    }

    let drinks = [];
    let heat = "medium";
    let spiritFilter = "";
    let surpriseSpirit = "";
    let lastSurprise = "";
    let currentDrink = null;
    let lastFocus = null;

    function filtered(spirit, q) {
      q = (q || "").trim().toLowerCase();
      return drinks.filter(function (d) {
        if (spirit && d.spirit !== spirit) return false;
        if (!q) return true;
        const blob = [d.name, d.ingredients, d.notes].join(" ").toLowerCase();
        return blob.indexOf(q) !== -1;
      });
    }

    function uniqueSpirits() {
      return Array.from(new Set(drinks.map(function (d) { return d.spirit; }))).sort();
    }

    function renderChips(el, selected, onPick) {
      const spirits = uniqueSpirits();
      el.innerHTML = "";
      ["", ...spirits].forEach(function (s) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = s || "All";
        b.setAttribute("aria-pressed", s === selected ? "true" : "false");
        b.addEventListener("click", function () { onPick(s); });
        el.appendChild(b);
      });
    }

    function renderLibrary() {
      const q = document.getElementById("search").value;
      const rows = filtered(spiritFilter, q);
      document.getElementById("count").textContent =
        rows.length + " of " + drinks.length + " drink" + (drinks.length === 1 ? "" : "s");
      const body = document.getElementById("library-body");
      if (!rows.length) {
        body.innerHTML = "<p class='empty'>No drinks match that search.</p>";
        return;
      }
      body.innerHTML = "";
      rows.forEach(function (d) {
        const st = STYLE[d.name] || {};
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card";
        btn.style.setProperty("--card", st.card || "");
        btn.style.setProperty("--glow-color", (st.accent || "#e8b85a") + "44");
        btn.innerHTML =
          "<span class='price'>$" + escapeHtml(d.price) + "</span>" +
          "<div class='card-visual'>" + glassSVG(d.name, false) + "</div>" +
          "<div class='card-meta'><h2>" + escapeHtml(d.name) + "</h2>" +
          "<div class='card-tags'><span class='tag'>" + escapeHtml(d.spirit) + "</span><span class='tag'>" + escapeHtml(d.type) + "</span></div></div>";
        btn.addEventListener("click", function () { openSheet(d); });
        body.appendChild(btn);
      });
    }

    function openSheet(d) {
      currentDrink = d;
      lastFocus = document.activeElement;
      const st = STYLE[d.name] || {};
      const pills = d.ingredients.split(/\s*,\s*/).filter(Boolean).map(function (p) {
        return "<span class='pill'>" + escapeHtml(p) + "</span>";
      }).join("");
      const notes = d.notes ? "<p class='notes'>" + escapeHtml(d.notes) + "</p>" : "";
      const cta = d.name === "Whiskey Powers"
        ? "<button type='button' class='cta' id='goto-calc'>Batch this in the calculator</button>"
        : "";
      document.getElementById("sheet-body").innerHTML =
        "<div class='sheet-visual' style='--glow: " + (st.accent || "#e8b85a") + "66'>" + glassSVG(d.name, true) + "</div>" +
        "<div class='sheet-top'><h2 id='sheet-title'>" + escapeHtml(d.name) + "</h2><div class='price-lg'>$" + escapeHtml(d.price) + "</div></div>" +
        "<div class='card-tags' style='margin-top:10px'><span class='tag'>" + escapeHtml(d.spirit) + "</span><span class='tag'>" + escapeHtml(d.type) + "</span></div>" +
        "<div class='pills'>" + pills + "</div>" +
        notes +
        "<p class='source'>" + escapeHtml(d.source) + "</p>" +
        cta;
      const ctaBtn = document.getElementById("goto-calc");
      if (ctaBtn) ctaBtn.addEventListener("click", function () { closeSheet(); showTab("calc"); });
      const sheet = document.getElementById("sheet");
      const backdrop = document.getElementById("backdrop");
      backdrop.hidden = false;
      sheet.hidden = false;
      requestAnimationFrame(function () {
        backdrop.classList.add("open");
        sheet.classList.add("open");
      });
      document.getElementById("sheet-close").focus();
    }

    function closeSheet() {
      const sheet = document.getElementById("sheet");
      const backdrop = document.getElementById("backdrop");
      sheet.classList.remove("open");
      backdrop.classList.remove("open");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      setTimeout(function () {
        sheet.hidden = true;
        backdrop.hidden = true;
      }, reduce ? 0 : 320);
      currentDrink = null;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    const HEAD = {
      library: { kicker: "The library", title: "Tonight's drinks", sub: "What are you in the mood for?" },
      surprise: { kicker: "Dealer's choice", title: "Surprise me", sub: "Shake the tin. We'll pick one from the list." },
      calc: { kicker: "Whiskey Powers", title: "Batch the night", sub: "How many are we pouring?" }
    };

    function showTab(which) {
      ["library", "surprise", "calc"].forEach(function (id) {
        document.getElementById("tab-" + id).setAttribute("aria-selected", id === which ? "true" : "false");
        document.getElementById("panel-" + id).classList.toggle("active", id === which);
      });
      const h = HEAD[which];
      document.getElementById("kicker").textContent = h.kicker;
      document.getElementById("headline").textContent = h.title;
      document.getElementById("subhead").textContent = h.sub;
    }

    function currentN() {
      return parseInt(document.getElementById("drinks").value, 10);
    }

    function setN(n) {
      n = Math.min(99, Math.max(1, Math.floor(Number(n) || 1)));
      document.getElementById("drinks").value = n;
      renderCalc(calculateBatch(n, heat));
    }

    function reducedMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function pickRandom(list, lastName) {
      if (!list.length) return null;
      if (list.length === 1) return list[0];
      let pick, guard = 0;
      do { pick = list[Math.floor(Math.random() * list.length)]; guard++; }
      while (pick.name === lastName && guard < 8);
      return pick;
    }

    function setStageDrink(d, placeholder) {
      const art = document.getElementById("stage-art");
      if (!d) {
        art.innerHTML = glassSVG("Whiskey Powers", true);
        document.getElementById("surprise-name").textContent = placeholder || "Shake one up";
        document.getElementById("surprise-sub").textContent = "A random drink from the library — optionally narrowed by spirit.";
        document.getElementById("surprise-open").hidden = true;
        return;
      }
      art.innerHTML = glassSVG(d.name, true);
      document.getElementById("surprise-name").textContent = d.name;
      document.getElementById("surprise-sub").textContent = d.spirit + " · " + d.type + " · $" + d.price;
      const open = document.getElementById("surprise-open");
      open.hidden = false;
      open.onclick = function () { openSheet(d); };
    }

    function shakeIt() {
      const list = filtered(surpriseSpirit, "");
      if (!list.length) return;
      const stage = document.getElementById("stage");
      const finish = function () {
        stage.classList.remove("shaking");
        const d = pickRandom(list, lastSurprise);
        lastSurprise = d.name;
        setStageDrink(d);
        if (navigator.vibrate) try { navigator.vibrate(18); } catch (e) {}
      };
      if (reducedMotion()) { finish(); return; }
      stage.classList.add("shaking");
      setTimeout(finish, 560);
    }

    document.getElementById("tab-library").addEventListener("click", function () { showTab("library"); });
    document.getElementById("tab-surprise").addEventListener("click", function () { showTab("surprise"); });
    document.getElementById("tab-calc").addEventListener("click", function () { showTab("calc"); });
    document.getElementById("search").addEventListener("input", renderLibrary);
    document.getElementById("minus").addEventListener("click", function () { setN(currentN() - 1); });
    document.getElementById("plus").addEventListener("click", function () { setN(currentN() + 1); });
    document.getElementById("drinks").addEventListener("input", function () { setN(currentN()); });
    document.querySelectorAll(".heat button").forEach(function (btn) {
      const n = parseInt(btn.querySelector(".peppers").getAttribute("data-n"), 10);
      btn.querySelector(".peppers").innerHTML = Array.from({ length: n }, chiliSVG).join("");
      btn.addEventListener("click", function () {
        heat = btn.getAttribute("data-heat");
        document.querySelectorAll(".heat button").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        renderCalc(calculateBatch(currentN(), heat));
      });
    });
    document.getElementById("calc-out").addEventListener("change", function (e) {
      const id = e.target && e.target.getAttribute("data-shop");
      if (!id) return;
      toggleChecked(id, e.target.checked);
      const label = e.target.nextElementSibling;
      if (label) label.classList.toggle("done", e.target.checked);
    });
    document.getElementById("shake-btn").addEventListener("click", shakeIt);
    document.getElementById("backdrop").addEventListener("click", closeSheet);
    document.getElementById("sheet-close").addEventListener("click", closeSheet);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && document.getElementById("sheet").classList.contains("open")) closeSheet();
    });

    renderCalc(calculateBatch(5, "medium"));
    setStageDrink(null);

    const tabParam = new URLSearchParams(location.search).get("tab");
    if (tabParam === "calc" || tabParam === "calculator") showTab("calc");
    else if (tabParam === "surprise") showTab("surprise");

    fetch("drinks.json")
      .then(function (res) {
        if (!res.ok) throw new Error("Could not load drinks.json");
        return res.json();
      })
      .then(function (data) {
        drinks = Array.isArray(data) ? data : [];
        function paintSpiritChips() {
          renderChips(document.getElementById("spirit-chips"), spiritFilter, function (s) {
            spiritFilter = s;
            paintSpiritChips();
            renderLibrary();
          });
        }
        function paintSurpriseChips() {
          renderChips(document.getElementById("surprise-chips"), surpriseSpirit, function (s) {
            surpriseSpirit = s;
            paintSurpriseChips();
          });
        }
        paintSpiritChips();
        paintSurpriseChips();
        renderLibrary();
      })
      .catch(function (err) {
        document.getElementById("library-body").innerHTML =
          "<p class='error'>Couldn't load drinks.json. Serve this folder over HTTP and keep drinks.json next to index.html.</p>";
        document.getElementById("count").textContent = "";
        console.error(err);
      });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }

  </script>
</body>
</html>
